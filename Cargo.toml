[workspace]
members = ["agepony-core", "agepony-desktop"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["NorseHorse <NorseHorse@norsehor.se>"]

[workspace.dependencies]
age = { version = "=0.12.1", features = ["armor", "ssh"] }
age-core = "=0.12.0"
zeroize = "1.9"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
