[workspace]
members = ["agepony-core", "agepony-desktop"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["NorseHorse <NorseHorse@norsehor.se>"]

[workspace.dependencies]
age = { version = "=0.12.1", features = ["armor", "ssh"] }
age-core = "=0.12.0"
zeroize = "1.9"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# scrypt is deliberately expensive, and agepony-core pins its work factor
# rather than measuring the machine (see agepony-core/src/passphrase.rs).
# Unoptimised, a single 2^18 run takes the best part of a minute, which
# would make `cargo test` in debug unusable. Dependencies are optimised;
# the workspace crates stay unoptimised and debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
