name: Build

# The workflow BurnPonyDesktop and RelayPonyDesktop both lack, which their own notes call a gap
# rather than a decision: without it a broken main is invisible until release day.
#
# Deliberately cheap and fast, so it is never the reason someone skips pushing.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test + clippy + fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: rustc --version && cargo --version

      # eframe needs these to LINK, not merely to run.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libwayland-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The same check the release asserts on every shipped artifact, run here so a break is caught
      # on the commit that caused it rather than on a tag.
      - name: selftest
        run: cargo run --release --bin agepony -- selftest
